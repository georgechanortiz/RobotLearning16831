seed: 42


# THEO: tuning log
# Need to decrease initial_log_std to prevent erratic behavior right when training starts

# https://araffin.github.io/post/sac-massive-sim/
# https://araffin.github.io/post/tune-sac-isaac-sim/

# Action space clipping for ManagerBasedRLEnv (which exposes unbounded actions).
# Set to null to disable. See: https://github.com/isaac-sim/IsaacLab/issues/3064
action_clip: 2.0

# Models are instantiated using skrl's model instantiator utility
# https://skrl.readthedocs.io/en/latest/api/utils/model_instantiators.html
models:
  separate: True
  policy:  # see gaussian_model parameters
    class: GaussianMixin
    clip_actions: False
    clip_log_std: True
    min_log_std: -5.0
    max_log_std: -2
    initial_log_std: -3
    network:
      - name: net
        input: OBSERVATIONS
        layers: [256, 256, 256]
        activations: relu
    output: ACTIONS
  critic_1:  # see deterministic_model parameters
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: OBSERVATIONS_ACTIONS
        layers: [256, 256, 256]
        activations: relu
    output: ONE
  critic_2:  # see deterministic_model parameters
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: OBSERVATIONS_ACTIONS
        layers: [256, 256, 256]
        activations: relu
    output: ONE
  target_critic_1:  # see deterministic_model parameters
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: OBSERVATIONS_ACTIONS
        layers: [256, 256, 256]
        activations: relu
    output: ONE
  target_critic_2:  # see deterministic_model parameters
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: OBSERVATIONS_ACTIONS
        layers: [256, 256, 256]
        activations: relu
    output: ONE


# Replay buffer
# https://skrl.readthedocs.io/en/latest/api/memories/random.html
memory:
  class: RandomMemory
  memory_size: 5000  # timesteps (rows); total capacity = 5000 * 2048 envs = ~10M transitions


# SAC agent configuration (field names are from SAC_DEFAULT_CONFIG)
# https://skrl.readthedocs.io/en/latest/api/agents/sac.html
agent:
  class: SAC
  gradient_steps: 64
  batch_size: 4096
  discount_factor: 0.99
  polyak: 0.005                  # soft update coefficient (tau)
  actor_learning_rate: 3.0e-4
  critic_learning_rate: 3.0e-4
  learning_rate_scheduler: null
  learning_rate_scheduler_kwargs: null
  state_preprocessor: RunningStandardScaler
  state_preprocessor_kwargs: null
  random_timesteps: 1000        # initial random exploration steps (fills replay buffer)
  learning_starts: 1000          # start learning after this many steps
  grad_norm_clip: 1.0
  learn_entropy: True            # automatic entropy tuning
  entropy_learning_rate: 1.0e-3
  initial_entropy_value: 1.0e-2
  target_entropy: null           # None = -dim(action_space)
  rewards_shaper_scale: 1.0
  # logging and checkpoint
  experiment:
    directory: "go2_flat_sac"
    experiment_name: ""
    write_interval: 100
    checkpoint_interval: 2000


# Sequential trainer
# https://skrl.readthedocs.io/en/latest/api/trainers/sequential.html
trainer:
  class: SequentialTrainer
  timesteps: 1600000
  environment_info: log
